# Example notomate workflow: join a channel's room whenever it goes from
# empty to occupied, and reply to any message posted there that tags
# @claude for as long as someone else is still around.
#
# Copy this into a notomate workspace's workflow editor. Before enabling it,
# configure on the workspace:
#   - secrets.ANTHROPIC_API_KEY       -> an Anthropic API key, OR
#     secrets.CLAUDE_CODE_OAUTH_TOKEN -> a token from `claude setup-token`,
#                                        if you want to run under a Claude
#                                        subscription instead of a metered key
#   - secrets.NM_API_KEY              -> a notomate personal API key
#                                        (User Settings > API Keys) belonging
#                                        to a member of this workspace
#   - vars.NM_API_BASE_URL            -> the notomate origin reachable from the
#                                        runner, e.g. https://notomate.example.com.
#                                        Must be the same origin notomate's own
#                                        editor uses (nginx-fronted, not the
#                                        notomate-api container directly):
#                                        the action's own Socket.IO connection
#                                        (channel messaging) and update_note's
#                                        collab (Hocuspocus) connection both
#                                        derive from this origin, and
#                                        authenticate with NM_API_KEY too.
#
# notomate's channel messaging runs over Socket.IO in real time. The
# workflow engine fires this job once per channel, the moment its room
# transitions from empty to occupied (i.e. the first person opens it) --
# not once per message. The action itself then opens its own Socket.IO
# connection into that room and stays there, replying to any message that
# tags @claude, until it's the only one left in the room, at which point it
# disconnects and the job ends.
name: Claude on room

on:
  channel:
    types: [room_created]

jobs:
  respond:
    runs-on: ubuntu-latest
    steps:
      - name: Run Claude
        uses: notomate/claude-notomate-action@v1
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Or, instead of anthropic-api-key, use a Claude subscription:
          # claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          notomate-base-url: ${{ vars.NM_API_BASE_URL }}
          notomate-api-key: ${{ secrets.NM_API_KEY }}
          # Defaults to claude-sonnet-5; override to pin a specific model:
          # model: claude-opus-4-20250514
