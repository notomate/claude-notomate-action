name: "Claude Notomate Action"
description: "Runs the Claude Agent SDK against a notomate @claude mention in a comment or channel message and replies in the same thread/channel."
author: "claude-notomate-action"

inputs:
  anthropic-api-key:
    description: "Anthropic API key used to run the Claude Agent SDK. Provide this or claude-code-oauth-token."
    required: false
    default: ""
  claude-code-oauth-token:
    description: "Claude Code OAuth token (from `claude setup-token`), used instead of a metered API key when running under a Claude subscription. Provide this or anthropic-api-key."
    required: false
    default: ""
  notomate-base-url:
    description: "Base URL notomate is reachable at, e.g. https://notomate.example.com or http://notomate-nginx. Must be the same origin notomate's editor itself uses (nginx-fronted): the update_note tool derives its collab (Hocuspocus) WebSocket endpoint from this origin's /ws/ route."
    required: true
  notomate-api-key:
    description: "Notomate personal API key (Authorization: Bearer) used to call the notomate REST API. Also authenticates the update_note tool's collab (Hocuspocus) connection, the same way it authenticates REST calls."
    required: true
  trigger-phrase:
    description: "Phrase that must appear in a comment or channel message to trigger the agent."
    required: false
    default: "@claude"
  allowed-tools:
    description: "Comma-separated list of tool names to allow. Bare names (e.g. list_notes) are treated as notomate tools; fully-qualified mcp__<server>__<tool> names (e.g. mcp__yfmcp__yfinance_search) reach servers configured via mcp-config. Defaults to the full curated set of notomate tools."
    required: false
    default: ""
  mcp-config:
    description: "JSON string configuring additional MCP servers to expose to the agent, alongside the built-in notomate server. Shape matches the Claude Code mcpServers config, e.g. '{\"mcpServers\":{\"yfmcp\":{\"command\":\"uvx\",\"args\":[\"yfmcp@latest\"]}}}'. A server's tools are only usable if also named (as mcp__<server>__<tool>) in allowed-tools. See examples/claude-with-external-mcp.yml."
    required: false
    default: ""
  direct-prompt:
    description: "Fixed task for schedule/workflow_dispatch triggers. The final response is published as a note by default. Ignored for comment.created/channel.room_created events."
    required: false
    default: ""
  publish-note:
    description: "Publish the direct-prompt final response as a note, including explanations of unavailable data. Set false to disable note publication. Only applies to direct-prompt runs."
    required: false
    default: "true"
  note-visibility:
    description: "Visibility of the automatically published note: private, public, or workspace. Only applies to direct-prompt runs."
    required: false
    default: "private"
  max-turns:
    description: "Maximum number of agent turns to run."
    required: false
    default: "30"
  model:
    description: "Claude model to use, e.g. claude-opus-4-20250514. Defaults to claude-sonnet-5."
    required: false
    default: "claude-sonnet-5"
  node-version:
    description: "Node.js version to run the action with."
    required: false
    default: "20"

outputs:
  note-id:
    description: "ID of the note automatically published by a direct-prompt run."
    value: ${{ steps.run.outputs.note-id }}
  conclusion:
    description: "One of success, skipped, or failure."
    value: ${{ steps.run.outputs.conclusion }}
  comment-id:
    description: "The id of the reply comment that was posted, if any."
    value: ${{ steps.run.outputs.comment-id }}
  message-id:
    description: "The id of the last reply channel message posted while joined to the room, if any."
    value: ${{ steps.run.outputs.message-id }}

runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Cache node_modules
      id: cache-node-modules
      uses: actions/cache@v4
      with:
        path: ${{ github.action_path }}/node_modules
        key: ${{ runner.os }}-claude-notomate-action-${{ hashFiles(format('{0}/package-lock.json', github.action_path)) }}

    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        npm ci --omit=dev

    - name: Run claude-notomate-action
      id: run
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        npx tsx src/index.ts
      env:
        INPUT_ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        INPUT_CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        INPUT_NOTOMATE_BASE_URL: ${{ inputs.notomate-base-url }}
        INPUT_NOTOMATE_API_KEY: ${{ inputs.notomate-api-key }}
        INPUT_TRIGGER_PHRASE: ${{ inputs.trigger-phrase }}
        INPUT_ALLOWED_TOOLS: ${{ inputs.allowed-tools }}
        INPUT_MCP_CONFIG: ${{ inputs.mcp-config }}
        INPUT_DIRECT_PROMPT: ${{ inputs.direct-prompt }}
        INPUT_PUBLISH_NOTE: ${{ inputs.publish-note }}
        INPUT_NOTE_VISIBILITY: ${{ inputs.note-visibility }}
        INPUT_MAX_TURNS: ${{ inputs.max-turns }}
        INPUT_MODEL: ${{ inputs.model }}
